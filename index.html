<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Daily Planner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav>
            <h2>My Daily Planner</h2>
            <div class="nav-links">
                <a href="#home">Home</a>
                <a href="#todo">To-Do List</a>
                <a href="#contact">Contact</a>
            </div>
        </nav>
    </header>

    <section class="welcome" id="home">
        <h1>Welcome to My Daily Planner</h1>
        <p>Organize your daily tasks and stay connected with me.</p>
    </section>

    <main>
        <section class="todo-section" id="todo">
            <h2>My To-Do List</h2>
            <p class="section-text">Add your daily tasks and manage your work.</p>

            <div class="todo-input">
                <input type="text" id="taskInput" placeholder="Enter a new task">
                <button id="addTask">Add Task</button>
            </div>

            <p id="taskError"></p>
            <ul id="taskList"></ul>
        </section>

        <section class="contact-section" id="contact">
            <h2>Contact Me</h2>
            <p class="section-text">Have any questions? Send me a message.</p>

            <form id="contactForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name">
                    <small id="nameError"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="text" id="email" placeholder="Enter your email">
                    <small id="emailError"></small>
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" placeholder="Enter subject">
                    <small id="subjectError"></small>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="5" placeholder="Write your message"></textarea>
                    <small id="messageError"></small>
                </div>

                <button type="submit">Send Message</button>
                <p id="successMessage"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 My Daily Planner | Created by Me</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
